<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple collection of learning and productivity links.">
    <meta name="theme-color" content="#f5f7fb">
    <title>Hayden's Links</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="sites">
      <header class="page-header">
        <p class="eyebrow">Quick links</p>
        <h1>Hayden's Links</h1>
        <p class="intro">Choose a resource to open it in a new tab.</p>
      </header>

      <nav class="resource-grid" aria-label="Learning and productivity resources">
        <a class="resource-card" href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
          <span class="resource-icon" aria-hidden="true">G</span>
          <span class="resource-name">Google</span>
          <span class="resource-description">Search and explore the web</span>
        </a>
        <a class="resource-card" href="https://office.live.com/start/Word.aspx" target="_blank" rel="noopener noreferrer">
          <span class="resource-icon word" aria-hidden="true">W</span>
          <span class="resource-name">Microsoft Word</span>
          <span class="resource-description">Create and edit documents</span>
        </a>
        <a class="resource-card" href="https://office.live.com/start/PowerPoint.aspx" target="_blank" rel="noopener noreferrer">
          <span class="resource-icon powerpoint" aria-hidden="true">P</span>
          <span class="resource-name">Microsoft PowerPoint</span>
          <span class="resource-description">Create and present slides</span>
        </a>
      </nav>
    </main>

    <footer class="site-footer">
      <small>&copy; <span id="year">2026</span> Schilling Enterprises</small>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
